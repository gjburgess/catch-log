<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch Log</title>
<style>
:root{--bg:#eef4f3;--card:#fff;--ink:#0d2b3a;--mute:#5a7280;--line:#cfdcdc;--accent:#0d2b3a;--on:#fff;--buoy:#f2b705;--green:#2f7d6b;--danger:#b3372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1d27;--card:#12303f;--ink:#e6f0ee;--mute:#8fb0b8;--line:#244552;--accent:#f2b705;--on:#0a1d27;--green:#5cc2a8;--danger:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:2rem;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
form,.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--buoy);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}.chk label{margin:0;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px;cursor:pointer;background:var(--accent);color:var(--on)}
button:disabled{opacity:.6}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:8px 12px}
.entry{margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.entry h3{margin:0;font-size:1.1rem}
.meta{color:var(--mute);font-size:.88rem}
.del{background:none;color:var(--danger);padding:4px 8px;align-self:start}
.empty,.msg{color:var(--mute);text-align:center;padding:16px}
.err{color:var(--danger)}
.sum{color:var(--mute);font-size:.9rem;margin:8px 0 10px}
.row{display:flex;gap:8px}.row input{flex:1}.row button{white-space:nowrap}
.meta a{color:var(--green)}
#app{display:none}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Catch log v1</h1><p class="sub" id="who-am-i">Saved to your Excel file on OneDrive.</p></div><button class="ghost" id="out" hidden>Sign out</button></div>
<div id="login" class="msg"><button id="in">Sign in with Microsoft</button><p id="loginerr" class="err"></p></div>
<div id="app">
<form id="f">
<div class="full"><label for="species">Species</label><input id="species" list="sp" required autocomplete="off"><datalist id="sp"><option>Mackerel<option>Bass<option>Pollack<option>Wrasse<option>Mullet<option>Bream<option>Plaice<option>Flounder<option>Dab<option>Whiting<option>Cod<option>Garfish<option>Pouting<option>Gurnard<option>Smoothhound</datalist></div>
<div><label for="len">Length (cm)</label><input id="len" type="number" min="0" step="0.5" inputmode="decimal"></div>
<div><label for="wt">Weight (lb)</label><input id="wt" type="number" min="0" step="0.01" inputmode="decimal"></div>
<div><label for="who">Caught by</label><select id="who"><option>Graham<option>Jess<option>Ben<option>Other</select></div>
<div><label for="dt">Date and time</label><input id="dt" type="datetime-local" required></div>
<div class="full"><label for="loc">Where</label><input id="loc"></div>
<div class="full"><label for="gps">GPS position</label><div class="row"><input id="gps" placeholder="latitude, longitude" inputmode="text"><button type="button" class="ghost" id="gpsb">Use my location</button></div></div>
<div class="full"><label for="how">Bait or method</label><input id="how"></div>
<div class="full"><label for="note">Notes</label><textarea id="note" rows="2"></textarea></div>
<div class="full chk"><input id="rel" type="checkbox" checked><label for="rel">Released</label></div>
<button class="full" id="save" type="submit">Save catch</button>
</form>
<div id="status" class="msg" role="status"></div>
<label for="flt">Show</label>
<select id="flt"><option value="">All species</option></select>
<p class="sum" id="sum"></p>
<div id="list"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
/* ---- SETTINGS: change these three ---- */
var CLIENT_ID = "eb3a85c8-6540-4421-b4c7-7eabc84de3df";
var TENANT = "18e27df6-b58f-4179-95eb-75925f548d9e";            // or paste your Directory (tenant) ID
var FILE_PATH = "CatchLog.xlsx";         // path from the root of your OneDrive
var TABLE = "Catches";                   // name of the table inside the workbook
/* -------------------------------------- */
var GRAPH = "https://graph.microsoft.com/v1.0/me/drive/root:/" + encodeURI(FILE_PATH) + ":/workbook/tables/" + encodeURIComponent(TABLE);
var SCOPES = ["Files.ReadWrite"];
var $ = function(i){return document.getElementById(i)};
if(typeof msal==="undefined"){$("loginerr").textContent="Couldn't load the Microsoft sign-in library. Check your connection or any content blocker and reload.";throw new Error("msal not loaded")}
var pca = new msal.PublicClientApplication({
  auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/"+TENANT,redirectUri:window.location.origin+window.location.pathname.replace(/index\.html$/,"")},
  cache:{cacheLocation:"localStorage"}
});
var account = null, rows = [];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function say(t,bad){var s=$("status");s.textContent=t||"";s.className="msg"+(bad?" err":"")}

function token(){
  return pca.acquireTokenSilent({scopes:SCOPES,account:account}).then(function(r){return r.accessToken},function(){
    return pca.acquireTokenRedirect({scopes:SCOPES,account:account});
  });
}
function graph(path,opts){
  return token().then(function(t){
    opts=opts||{};opts.headers={"Authorization":"Bearer "+t,"Content-Type":"application/json"};
    return fetch(GRAPH+path,opts);
  }).then(function(r){
    if(r.status===404)throw new Error("Could not find the table \""+TABLE+"\" in "+FILE_PATH+" on your OneDrive. Check the setup steps.");
    if(!r.ok)throw new Error("Microsoft returned an error ("+r.status+").");
    return r.status===204?null:r.json();
  });
}

function load(){
  say("Loading catches…");
  graph("/rows").then(function(j){
    rows=j.value.map(function(r,i){var v=r.values[0];return{i:i,dt:v[0],species:v[1],len:v[2],wt:v[3],who:v[4],loc:v[5],how:v[6],rel:v[7],note:v[8],gps:v[9]}}).filter(function(c){return String(c.species||"").trim()});
    say("");render();
  }).catch(function(e){say(e.message,true)});
}
function render(){
  var sel=$("flt"),cur=sel.value,seen={};
  rows.forEach(function(c){var k=String(c.species).trim().toLowerCase();if(k&&!seen[k])seen[k]=String(c.species).trim()});
  sel.innerHTML='<option value="">All species</option>'+Object.keys(seen).sort().map(function(k){return'<option value="'+esc(k)+'"'+(k===cur?' selected':'')+'>'+esc(seen[k])+'</option>'}).join("");
  var list=rows.filter(function(c){return!cur||String(c.species).trim().toLowerCase()===cur});
  list.sort(cur?function(a,b){return(Number(b.wt)||0)-(Number(a.wt)||0)||(Number(b.len)||0)-(Number(a.len)||0)}:function(a,b){return String(b.dt).localeCompare(String(a.dt))});
  function st(f){var v=list.map(function(c){return Number(c[f])||0}).filter(Boolean);return v.length?{avg:(v.reduce(function(s,x){return s+x},0)/v.length).toFixed(1),max:Math.max.apply(null,v)}:null}
  var w=st("wt"),l=st("len");
  $("sum").textContent=cur?list.length+" caught, biggest first"+(w?" · weight: best "+w.max+" lb, average "+w.avg+" lb":"")+(l?" · length: longest "+l.max+" cm, average "+l.avg+" cm":""):"";
  $("list").innerHTML=list.length?list.map(function(c){
    var size=[c.len?c.len+" cm":"",c.wt?c.wt+" lb":""].filter(Boolean).join(", ");
    return'<div class="entry"><h3>'+esc(c.species)+(c.rel==="Yes"?" (released)":"")+'</h3><button class="del" data-i="'+c.i+'">Delete</button>'+
    '<div class="meta">'+esc(c.who)+(size?" · "+size:"")+'</div><div></div>'+
    '<div class="meta">'+esc(String(c.dt).replace("T"," "))+(c.loc?" · "+esc(c.loc):"")+'</div><div></div>'+
    (/^-?\d+(\.\d+)?, ?-?\d+(\.\d+)?$/.test(String(c.gps||""))?'<div class="meta"><a href="https://www.google.com/maps?q='+encodeURIComponent(String(c.gps).replace(/ /g,""))+'" target="_blank" rel="noopener">'+esc(c.gps)+' (open map)</a></div><div></div>':"")+
    (c.how?'<div class="meta">'+esc(c.how)+'</div><div></div>':"")+(c.note?'<div class="meta">'+esc(c.note)+'</div><div></div>':"")+'</div>';
  }).join(""):'<div class="empty">No catches yet. Log your first fish above.</div>';
}

$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var v=[$("dt").value,$("species").value.trim(),parseFloat($("len").value)||"",parseFloat($("wt").value)||"",$("who").value,$("loc").value.trim(),$("how").value.trim(),$("rel").checked?"Yes":"No",$("note").value.trim(),$("gps").value.trim()];
  $("save").disabled=true;say("Saving…");
  graph("/rows/add",{method:"POST",body:JSON.stringify({values:[v]})}).then(function(){
    $("f").reset();$("dt").value=nowLocal();$("rel").checked=true;$("save").disabled=false;load();
  }).catch(function(err){$("save").disabled=false;say(err.message,true)});
});
$("list").addEventListener("click",function(e){
  var i=e.target.getAttribute("data-i");if(i===null||!confirm("Delete this catch from your Excel file?"))return;
  say("Deleting…");
  graph("/rows/itemAt(index="+i+")",{method:"DELETE"}).then(load).catch(function(err){say(err.message,true)});
});
$("flt").addEventListener("change",render);
$("gpsb").addEventListener("click",function(){
  var b=$("gpsb");
  if(!navigator.geolocation){say("This browser can't provide a location.",true);return}
  b.textContent="Locating…";b.disabled=true;
  navigator.geolocation.getCurrentPosition(function(p){
    $("gps").value=p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5);
    b.textContent="Use my location";b.disabled=false;say("");
  },function(){
    b.textContent="Use my location";b.disabled=false;
    say("Couldn't get your location. Allow location access for this site in your phone's browser settings.",true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
});
$("in").addEventListener("click",function(){pca.loginRedirect({scopes:SCOPES})});
$("out").addEventListener("click",function(){pca.logoutRedirect({account:account})});

function start(){
  account=pca.getActiveAccount()||pca.getAllAccounts()[0]||null;
  if(!account)return;
  pca.setActiveAccount(account);
  $("login").style.display="none";$("app").style.display="block";$("out").hidden=false;
  $("who-am-i").textContent="Saving to "+FILE_PATH+" as "+account.username;
  $("dt").value=nowLocal();load();
}
pca.initialize().then(function(){return pca.handleRedirectPromise()}).then(function(r){
  if(r&&r.account)pca.setActiveAccount(r.account);start();
}).catch(function(e){$("loginerr").textContent=e.message});
</script>
</body>
</html>
